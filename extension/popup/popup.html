<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <!-- Where pages are going: the workspace you're recording into, with its
       switcher and the pause control right beside it. -->
  <div class="ws">
    <button id="ws-toggle" class="ws-toggle" aria-haspopup="listbox" aria-expanded="false">
      <span id="rec-dot" class="rec-dot" aria-hidden="true"></span>
      <span class="ws-text">
        <span id="rec-label" class="ws-label">Recording into</span>
        <span id="ws-name" class="ws-name">…</span>
      </span>
      <span class="chev" aria-hidden="true">▾</span>
    </button>
    <button id="pause-btn" class="icon-btn" aria-label="Pause recording" title="Pause recording"></button>
  </div>
  <div id="ws-meta" class="meta"></div>

  <div id="ws-menu" class="ws-menu" role="listbox" hidden>
    <div id="ws-list"></div>
    <form id="ws-new" class="ws-new">
      <button type="button" id="ws-new-btn" class="ws-new-btn">＋ New workspace</button>
      <input id="ws-new-name" type="text" placeholder="Name it, then press Enter" maxlength="80" hidden>
    </form>
  </div>

  <!-- What you can do with the page you're on. -->
  <section id="page" class="page" hidden>
    <div id="page-host" class="label"></div>
    <div class="page-row">
      <button id="star-btn" class="star-btn" title="Star this page so it’s easy to find again (Alt+S)">☆ Star</button>
      <button id="translate-btn" class="translate-btn" hidden></button>
      <div class="more-wrap">
        <button id="more-btn" class="icon-btn" aria-label="More for this page" aria-haspopup="menu" aria-expanded="false" hidden>⋯</button>
        <div id="more-menu" class="more-menu" role="menu" hidden></div>
      </div>
    </div>
  </section>

  <!-- Where to go next. -->
  <button id="resume-btn" class="resume" hidden>
    <span class="resume-label">Resume</span>
    <span id="resume-title"></span>
    <span id="resume-where"></span>
  </button>
  <div class="go">
    <button id="open-map-btn">Trail</button>
    <button id="open-evidence-btn">Board</button>
    <button id="panel-btn">Side panel</button>
  </div>

  <footer>
    <span id="ai-status" class="ai-status">Checking Ollama…</span>
    <span class="keys">Alt+S star</span>
  </footer>
  <div id="ollama-hint" class="hint" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
