<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Research Trail</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <header>
    <select id="ws-select" title="Workspace"></select>
    <button id="pause-btn" class="icon" title="Pause page capture (nothing gets recorded until you resume)"></button>
    <button id="ask-btn" class="icon" title="Ask questions about everything in this workspace">Ask</button>
    <button id="evidence-btn" class="icon">Evidence</button>
    <button id="map-btn" class="icon" title="Open the full map">Map</button>
    <button id="close-btn" class="icon" title="Close panel">Close</button>
  </header>

  <div id="suggest-note" hidden>
    <span id="suggest-note-text"></span>
    <button id="suggest-open">Review</button>
  </div>

  <div id="domain-strip" hidden></div>

  <div id="graph-wrap">
    <div id="cy"></div>
    <div id="hover-preview" hidden>
      <img id="hover-preview-img" alt="">
      <div id="hover-preview-title"></div>
    </div>
  </div>

  <div id="empty" hidden>
    <p>Browse anywhere — pages appear here as you go, and this panel always shows where you are in the web of what you've seen.</p>
  </div>

  <footer id="here" hidden>
    <div id="here-title"></div>
    <div id="here-from" class="muted"></div>
  </footer>

  <div id="actions">
    <button id="park-btn">Park other tabs</button>
    <p class="hint">Closes every captured tab except this one. Nothing is lost — the pages stay on the map, one click to reopen.</p>
  </div>

  <details id="argument-outline" open><summary>Curated argument</summary><form id="jot-form" class="jot-form"><input id="jot-input" placeholder="Jot a thought…" autocomplete="off" aria-label="Jot a thought"><button>Save</button></form><select id="outline-board" aria-label="Argument"></select><ol id="outline-list"></ol><p id="outline-status"></p><div class="outline-actions"><button id="outline-present">Walk through</button><button id="outline-capture">Capture passage</button><button id="outline-screenshot">Capture screenshot</button></div></details>
  <div id="amtshelfer-card"></div>

  <script src="../vendor/cytoscape.min.js"></script>
  <script src="../vendor/layout-base.js"></script>
  <script src="../vendor/cose-base.js"></script>
  <script src="../vendor/cytoscape-fcose.js"></script>
  <script type="module" src="panel.js"></script>
  <script type="module" src="../evidence/outline.js"></script>
</body>
</html>
